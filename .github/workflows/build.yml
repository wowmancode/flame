name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon :app:assembleRelease 2>&1 | tee build.log
      - name: Report build errors
        if: failure()
        run: |
          # Surface compiler errors as annotations so they are visible without downloading logs
          grep -E "^e: |What went wrong|error:|Exception|^  > " build.log | grep -v "> Task" | head -40 > errors.txt || true
          msg=$(sed 's/%/%25/g' errors.txt | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${msg}"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: FlameDroid-apk
          path: app/build/outputs/apk/release/*.apk
